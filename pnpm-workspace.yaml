packages:
  - apps/*
  - packages/*

allowBuilds:
  # Optional native speedups and binary checks that the API's dev tools
  # (Testcontainers, drizzle-kit) work without.
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false
  unrs-resolver: false

engineStrict: true

# Minutes (7 days): skip versions published less than a week ago.
minimumReleaseAge: 10080

peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: "10"
    eslint-plugin-react>eslint: "10"
