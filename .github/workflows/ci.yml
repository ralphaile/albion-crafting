name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HUSKY: "0"
  AFFECTED: ${{ github.event_name == 'pull_request' && '--filter=...[origin/main]' || '' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Audit production dependencies
        run: pnpm audit --prod || echo "::warning title=pnpm audit::pnpm audit --prod reported a problem. See its step in the Checks job."
      - run: pnpm format:check
      - run: pnpm check:deps
      - run: pnpm check:unused
      - run: pnpm check:versions
      - run: pnpm exec turbo run lint typecheck build $AFFECTED
      - run: pnpm coverage
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: node .github/scripts/coverage-summary.js >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm --filter @aoc/web exec playwright install --with-deps --only-shell chromium
      - run: pnpm exec turbo run e2e $AFFECTED
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-results-${{ github.run_attempt }}
          path: apps/web/test-results/
          retention-days: 14
