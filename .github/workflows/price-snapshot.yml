name: Price snapshot

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  snapshot:
    name: Snapshot
    runs-on: ubuntu-24.04
    # Downloading every icon takes about 7 minutes when the cache is empty.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: ./.github/actions/setup
      - run: pnpm exec turbo run build --filter=@aoc/web...
      - run: pnpm --filter @aoc/web run prices:snapshot
      # The deploy replaces the whole site, icons included.
      - uses: ./.github/actions/item-icons
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist/

  # A failed snapshot never gets here, so the site keeps the last one.
  deploy:
    name: Deploy
    needs: snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
